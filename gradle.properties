# Done to increase the memory available to gradle.
org.gradle.jvmargs             = -Xmx4G
org.gradle.parallel            = true

org.gradle.configuration-cache = false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version              = 1.21.1
yarn_mappings                  = 1.21.1+build.3
loader_version                 = 0.18.4
loom_version                   = 1.15-SNAPSHOT

# Fabric API
compile_only_fabric_api        = false
fabric_version                 = 0.116.14+1.21.1

# Recipe Viewer
compile_only_rei               = true
rei_version                    = 16.0.799
# EIV has no 1.21.1 build (mod starts at 1.21.4); compat module removed for this backport

# Sodium
sodium_version                 = mc1.21.1-0.6.13-fabric

# Iris
iris_version                   = 1.8.8+1.21.1-fabric

# CC: Tweaked
cct_version                    = 1.21-fabric:1.111.0

# Trinkets (Canary fork requires 1.21.4+; using upstream Trinkets for 1.21.1)
trinkets_version                = 3.10.0
cca_version                    = 6.1.0

# Accessories
accessories_version            = 1.1.0-beta.53+1.21.1

# ModernFix (mVUS fork has no 1.21.1 build; upstream ModernFix supports 1.21.1 natively)
modernfix_version              = 5.25.1+mc1.21.1

# Mod Properties
mod_version                    = 6.0.9-1.0
mod_id                         = 2
maven_group                    = com.zurrtum
archives_base_name             = create-fly
